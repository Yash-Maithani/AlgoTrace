"""
Base template for algorithm visualization pages
"""
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Algorithm Visualizer{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Header with Navigation -->
    <header>
        <nav>
            <a href="{{ url_for('index') }}" class="logo">Algorithm Visualizer</a>
            <div class="nav-links">
                <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">Home</a>
                <a href="{{ url_for('sorting.sorting_page') }}" class="nav-link {% if 'sorting' in request.endpoint %}active{% endif %}">Sorting</a>
                <a href="{{ url_for('graph.graph_page') }}" class="nav-link {% if 'graph' in request.endpoint %}active{% endif %}">Graph</a>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <a href="https://github.com/yourusername/algorithm-visualizer" target="_blank">
                    <i class="fab fa-github"></i> GitHub
                </a>
            </div>
        </div>
    </footer>

    <!-- Common JavaScript -->
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
